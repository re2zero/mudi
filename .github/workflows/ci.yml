name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      # no macos-x86_64: the macos-13 (Intel) runner image was retired
      # on 2025-11-14; revisit with a universal build on macos-15
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            dtk: OFF
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            dtk: OFF
          - name: macos-aarch64
            os: macos-14
            dtk: OFF

    runs-on: ${{ matrix.os }}
    env:
      # asset names expected by the in-app update checker
      ASSET: mudi-${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            qt6-5compat-dev \
            libicu-dev libuchardet-dev libchardet-dev
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt pkg-config icu4c uchardet cmake
          echo "CMAKE_PREFIX_PATH=$(brew --prefix qt)" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:$(brew --prefix uchardet)/lib/pkgconfig" >> "$GITHUB_ENV"
          # uchardet 0.0.8's pkg-config file points Cflags at
          # <include>/uchardet while consumers include <uchardet/uchardet.h>;
          # hand the include root to the compiler directly
          echo "UCHARDET_FLAGS=-I$(brew --prefix uchardet)/include" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=Release
          -DDISABLE_DTK=${{ matrix.dtk }}
          ${CMAKE_PREFIX_PATH:+-DCMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH}
          ${UCHARDET_FLAGS:+-DCMAKE_CXX_FLAGS=$UCHARDET_FLAGS}

      - name: Build
        run: cmake --build build --parallel

      - name: Stage portable layout
        run: |
          cmake --install build --prefix stage
          mkdir -p stage/share/terminalwidget6 2>/dev/null || true
          tar -C stage -czf "$ASSET.tar.gz" .
          cp build/mudi "$ASSET"
          ls -la "$ASSET" "$ASSET.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.tar.gz
            stage/
          if-no-files-found: error

      - name: Package Linux (deb + rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y rpm
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in [0-9]*) ;; *) VERSION="0.0.0" ;; esac
          DEB_ARCH="$(dpkg --print-architecture)"
          RPM_ARCH="$(uname -m)"

          # deb: hand-rolled control. The core Qt6 library is named
          # libqt6core6t64 on Ubuntu 24.04+ but libqt6core6 on deepin and
          # Debian 12 — offer both so one package serves all of them.
          mkdir -p debroot/DEBIAN debroot/usr
          cp -a stage/. debroot/usr/
          cat > debroot/DEBIAN/control <<EOF
          Package: mudi
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: re2zero <re2zero@users.noreply.github.com>
          Depends: libqt6core6t64 (>= 6.4) | libqt6core6 (>= 6.4), libqt6gui6 (>= 6.4), libqt6widgets6 (>= 6.4), libqt6network6 (>= 6.4), libqt6dbus6 (>= 6.4), libqt6core5compat6, libuchardet0, libchardet1
          Description: MuDi (牧笛) — terminal workspace frontend for AI coding agents
           GUI frontend for the herdr terminal workspace manager (plain Qt
           build; on deepin/UOS install the DTK-flavored package instead).
          EOF
          dpkg-deb --build --root-owner-group debroot "mudi_${VERSION}_${DEB_ARCH}.deb"

          # rpm: dependencies are auto-derived from the linked libraries
          mkdir -p rpmtop/BUILD rpmtop/RPMS rpmtop/SPECS
          mkdir -p rpmroot/usr
          cp -a stage/. rpmroot/usr/
          sed "s/@VERSION@/${VERSION}/" packaging/rpm/mudi.spec > rpmtop/SPECS/mudi.spec
          rpmbuild -bb --define "_topdir ${PWD}/rpmtop" \
            --define "_rpmdir ${PWD}/rpmtop/RPMS" \
            --buildroot "${PWD}/rpmroot" \
            rpmtop/SPECS/mudi.spec
          cp "rpmtop/RPMS/${RPM_ARCH}/mudi-${VERSION}-1.${RPM_ARCH}.rpm" ./
          ls -la ./*.deb ./*.rpm

      - name: Upload Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-packages
          path: |
            *.deb
            *.rpm
          if-no-files-found: error

  release:
    name: Attach release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          # this job never checks out the repo, so gh has no git context
          # to resolve the repository from (the v0.3.0 attach failure)
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          # mudi_* matches only debs — a bare mudi_* also sweeps the .qm
          # translations inside every stage/ artifact tree
          find artifacts -type f \( -name 'mudi-*' -o -name 'mudi_*.deb' -o -name '*.tar.gz' \) \
            ! -name '*.tar.gz.*' -print0 | xargs -0 gh release upload "$TAG" --clobber
